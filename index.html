<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الـ 1000 لغز للعباقرة 🧠</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h1 { color: #000; background: #00ffcc; padding: 12px; border-radius: 10px; font-size: 22px; margin-bottom: 5px; box-shadow: 0 0 15px rgba(0,255,204,0.3); }
        
        .stats-container { display: flex; justify-content: space-around; background: #1f2833; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; color: #00ffcc; }
        
        #room {
            width: 100%;
            min-height: 200px;
            background: linear-gradient(to bottom, #1f2833, #0b0c10);
            border: 3px solid #00ffcc;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-shadow: 0 0 25px rgba(0,255,204,0.1);
            box-sizing: border-box;
        }

        .clue-text { font-size: 16px; color: #fff; line-height: 1.6; text-align: center; max-width: 90%; }
        
        .input-area { margin-top: 20px; width: 100%; }
        input[type="text"] { padding: 12px; font-size: 18px; border-radius: 8px; border: 2px solid #00ffcc; background: #151722; color: #fff; text-align: center; width: 80%; max-width: 280px; }
        
        .action-btn { background: #00ffcc; color: #000; border: none; padding: 14px 40px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer; margin-top: 15px; box-shadow: 0 0 15px rgba(0,255,204,0.3); }
        
        #status-msg { font-size: 16px; height: 25px; color: #ff3838; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>🧠 موسوعة التحدي: 1000 لغز 🧠</h1>
    
    <div class="stats-container">
        <div>اللغز الحالي: <span id="current-index">1</span></div>
        <div>النقاط: <span id="score">0</span></div>
    </div>

    <div id="room">
        <div id="clue-box" class="clue-text">جاري تحميل اللغز الأول...</div>
    </div>

    <div class="input-area">
        <input type="text" id="player-answer" placeholder="اكتب إجابتك هنا...">
        <br>
        <button class="action-btn" onclick="checkAnswer()">تحقق من الإجابة 🔍</button>
    </div>

    <div id="status-msg"></div>

    <script>
        // هنا مخزن الألغاز (تقدري تضيفي لحد 1000 لغز بنفس الطريقة تحت بعض)
        const allRiddles = [
            {
                q: "اللغز 1: أنا شيء أملك قلباً ولكن ليس لديّ جسد، فما أنا؟",
                a: "القرش" // الإجابة المقبولة (أو التفاح، الكود يقبل الكلمات بدقة)
            },
            {
                q: "اللغز 2 (منطقي): ما هو الشيء الذي يملكه الفقير، ويحتاجه الغني، وإذا أكلته تموت؟",
                a: "لاشيء"
            },
            {
                q: "اللغز 3 (رياضيات): عدد إذا ضربته في نفسه وأضفت إليه 5 أصبح الناتج 41؟ فما هو؟",
                a: "6"
            },
            {
                q: "اللغز 4: كلمة من 4 حروف، إذا حذفت أول حرفين أصبحت اسم دولة عربية؟",
                a: "عمان" // مثل: عمان (إذا حذفنا أول حرفين من كلمة 'جمان' أو 'عمان' كإجابة)
            },
            {
                q: "اللغز 5 (تشفير): إذا كانت أ = 1، ب = 2، ج = 3.. فما هي الكلمة التي مجموع أرقامها يساوي 5 وتتكون من حرفين؟",
                a: "بدا" // ب(2) + د(3) = 5 (أو أى كلمة تركب منطقياً)
            }
            // تقدري تنسخي السطور دي وتزودي لغز 6 و 7 و 8 لحد 1000!
        ];

        // لتسهيل الإجابات، اللعبة هتقبل حل اللغز الأول لو كتب "التفاح" أو "القرش" مثلاً، تعال نثبت الإجابات الذكية:
        allRiddles[0].a = "التفاح"; // قلب التفاحة
        allRiddles[3].a = "سلطانة"; // طانة (عُمان) أو كلمة شبهها، لنبسطها: الإجابة "عمان"

        let currentIndex = 0;
        let score = 0;

        // دالة لعرض اللغز الحالي
        function loadRiddle() {
            if (currentIndex < allRiddles.length) {
                document.getElementById("clue-box").innerText = allRiddles[currentIndex].q;
                document.getElementById("current-index").innerText = currentIndex + 1;
                document.getElementById("player-answer").value = ""; // مسح الخانة
                document.getElementById("status-msg").innerText = "";
            } else {
                // لو خلص كل الألغاز المتاحة
                document.getElementById("room").innerHTML = "<div class='clue-text'>🎉 أسطوري! لقد أنهيت جميع الألغاز المتاحة حالياً في اللعبة! انتظر التحديث القادم للـ 1000 لغز! 🎉</div>";
                document.querySelector(".input-area").style.display = "none";
            }
        }

        // فحص إجابة اللاعب
        function checkAnswer() {
            let playerInput = document.getElementById("player-answer").value.trim();
            let correctAnswer = allRiddles[currentIndex].a;

            if (playerInput === correctAnswer) {
                score += 10;
                document.getElementById("score").innerText = score;
                currentIndex++;
                
                document.getElementById("status-msg").style.color = "#00ffcc";
                document.getElementById("status-msg").innerText = "✨ إجابة صحيحة! +10 نقاط ✨";
                
                // الانتقال للغز التالي بعد ثانية
                setTimeout(loadRiddle, 1000);
            } else {
                document.getElementById("status-msg").style.color = "#ff3838";
                document.getElementById("status-msg").innerText = "❌ إجابة خاطئة! فكر جيداً وأعد المحاولة.";
            }
        }

        // تشغيل اللعبة لأول مرة
        window.onload = loadRiddle;
    </script>
</body>
</html>
